services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      CITYEYE_ENVIRONMENT: development
      CITYEYE_LOG_LEVEL: debug
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - cityeye_frontend_node_modules:/app/node_modules
    ports: !override
      - "${CITYEYE_FRONTEND_PORT:-5173}:5173"

volumes:
  cityeye_frontend_node_modules:
